# ==============================================================
# Application Configuration
# ==============================================================
spring.application.name=employee-task-management-api
server.port=8080

# ==============================================================
# OPTION 1: H2 In-Memory Database (ACTIVE BY DEFAULT FOR TESTING)
# Allows running the application instantly without installing MySQL.
# Open http://localhost:8080/h2-console (JDBC URL: jdbc:h2:mem:empdb)
# ==============================================================
spring.datasource.url=jdbc:h2:mem:empdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==============================================================
# OPTION 2: MySQL Database (Uncomment to use your local MySQL)
# Make sure MySQL service is running and 'emp_task_db' database is accessible
# ==============================================================
# spring.datasource.url=jdbc:mysql://localhost:3306/emp_task_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=root
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================================================
# JPA / Hibernate Configuration
# ==============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==============================================================
# Swagger / OpenAPI Configuration
# UI available at: http://localhost:8080/swagger-ui.html
# ==============================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

